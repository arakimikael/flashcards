<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Gamificados</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .selector-container {
            margin-bottom: 25px;
			display: grid;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 5px;
            border: 2px solid #6366f1;
            background: white;
            cursor: pointer;
            font-weight: bold;
            color: #4338ca;
        }

        .flashcard-container {
            perspective: 1000px; 
            width: 500px;
            height: 300px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
            box-sizing: border-box;
            border-radius: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .front {
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #6366f1;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .back {
            background-color: #6366f1;
            color: #ffffff;
            transform: rotateY(180deg);
            transition: background-color 0.3s;
        }

        /* --- ANIMAÇÃO DE ERRO (VIBRAÇÃO E VERMELHO SUAVE) --- */
        .shake {
            animation: shakeAnima 0.5s ease-in-out;
        }

        /* Aplica o vermelho suave nas duas faces durante o erro */
        .shake .front {
            background-color: #fee2e2;
            border-color: #ef4444;
        }
        .shake .back {
            background-color: #ef4444;
        }

        @keyframes shakeAnima {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* --- CONTROLES E BOTÕES --- */
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .feedback-buttons {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-nav { background-color: #6366f1; }
        .btn-nav:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        /* Cores dos novos botões de Acerto/Erro */
        .btn-success { background-color: #10b981; }
        .btn-danger { background-color: #f43f5e; }

        .counter {
            font-size: 1rem;
            color: #64748b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="selector-container">
        <select id="aula-select" onchange="trocarAula()">
            <option value="aula1">Aula 1: Introdução à Tecnologia</option>
            <option value="aula2">Aula 2: Conceitos de Internet</option>
        </select>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="face front" id="text-front">Carregando...</div>
            <div class="face back" id="text-back">Carregando...</div>
        </div>
    </div>

    <div class="feedback-buttons">
        <button class="btn-danger" onclick="feedbackErro(event)">Errada ❌</button>
        <button class="btn-success" onclick="feedbackAcerto(event)">Correta 🎉</button>
    </div>

    <div class="controls">
        <button class="btn-nav" id="btn-prev" onclick="prevCard(event)">Anterior</button>
        <span class="counter" id="card-counter">0 / 0</span>
        <button class="btn-nav" id="btn-next" onclick="nextCard(event)">Próximo</button>
    </div>

    <script>
        let meusFlashcards = []; // Começa vazio e será preenchido pelo arquivo JSON
        let indexAtual = 0;

        const cardElement = document.getElementById('card');
        const textFront = document.getElementById('text-front');
        const textBack = document.getElementById('text-back');
        const cardCounter = document.getElementById('card-counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const aulaSelect = document.getElementById('aula-select');

        // 1. CARREGAMENTO ASSÍNCRONO DOS ARQUIVOS
        async function carregarDadosAula(arquivoJson) {
            try {
                textFront.innerText = "Carregando dados...";
                textBack.innerText = "Carregando dados...";
                
                // Faz a busca do arquivo local
                const resposta = await fetch(arquivoJson);
                
                // Converte o texto puro do arquivo em uma lista (Array) de JavaScript
                meusFlashcards = await resposta.json();
                
                // Reinicia o contador para o primeiro card da nova lista
                indexAtual = 0;
                renderCard();
            } catch (erro) {
                console.error("Erro ao carregar o arquivo JSON:", erro);
                textFront.innerText = "Erro ao carregar a aula. Verifique o servidor local.";
            }
        }

        // 2. EXIBIÇÃO EM TELA
        function renderCard() {
            if (meusFlashcards.length === 0) return;

            cardElement.classList.remove('flipped'); 
            
            textFront.innerText = meusFlashcards[indexAtual].pergunta;
            textBack.innerText = meusFlashcards[indexAtual].resposta;

            cardCounter.innerText = `${indexAtual + 1} / ${meusFlashcards.length}`;

            btnPrev.disabled = indexAtual === 0;
            btnNext.disabled = indexAtual === meusFlashcards.length - 1;
        }

        // 3. EVENTO DE TROCA DE AULA
        function trocarAula() {
            const arquivoSelecionado = aulaSelect.value;
            carregarDadosAula(arquivoSelecionado);
        }

        // 4. CONTROLES BÁSICOS
        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function nextCard(event) {
            event.stopPropagation();
            if (indexAtual < meusFlashcards.length - 1) {
                indexAtual++;
                renderCard();
            }
        }

        function prevCard(event) {
            event.stopPropagation();
            if (indexAtual > 0) {
                indexAtual--;
                renderCard();
            }
        }

        // Inicializa o app carregando o primeiro arquivo da lista automaticamente
        carregarDadosAula(aulaSelect.value);
    </script>

</body>
</html>
