<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Definição das cores usando variáveis para os dois modos */
        :root {
            --bg-color: #f0f2f5;
            --card-front-bg: #ffffff;
            --card-front-text: #333333;
            --card-front-border: #3b82f6;
            --text-color: #1e3a8a;
        }

        [data-theme="dark"] {
            --bg-color: #121214;
            --card-front-bg: #1a1a1e;
            --card-front-text: #e1e1e6;
            --card-front-border: #60a5fa;
            --text-color: #93c5fd;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--card-front-text);
            font-family: Arial, sans-serif;
            transition: background-color 0.3s;
        }

        /* Topo da página: Alinhamento do Select e do Download */
        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            align-items: center;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 5px;
            border: 2px solid #3b82f6;
            background: var(--card-front-bg);
            color: var(--card-front-text);
            cursor: pointer;
            font-weight: bold;
        }

        .flashcard-container {
            perspective: 1000px; 
            width: 500px;
            height: 300px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 15px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
            box-sizing: border-box;
            border-radius: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .front {
            background-color: var(--card-front-bg);
            color: var(--card-front-text);
            border: 2px solid var(--card-front-border);
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        .back {
            background-color: #3b82f6;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        /* --- ANIMAÇÃO DE ERRO --- */
        .shake {
            animation: shakeAnima 0.5s ease-in-out;
        }

        .shake .front {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
        }
        .shake .back {
            background-color: #ef4444;
        }

        @keyframes shakeAnima {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* --- CONTROLES E BOTÕES --- */
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .feedback-buttons {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-nav { background-color: #3b82f6; }
        .btn-nav:disabled { background-color: #cbd5e1; cursor: not-allowed; }
        .btn-success { background-color: #10b981; }
        .btn-danger { background-color: #f43f5e; }
        
        .btn-download {
            background-color: #8b5cf6; /* Roxo para destacar */
            padding: 10px 15px;
        }

        .counter {
            font-size: 1rem;
            color: #64748b;
            font-weight: bold;
        }

        /* --- BOTÃO DE ALTERNAR TEMA (FIXO NO CANTO INFERIOR DIREITO) --- */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #374151;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="aula-select" onchange="trocarAula()">
            <option value="aula1.json">Aula 1: Conceitos Iniciais</option>
            <option value="aula2.json">Aula 2: Desenvolvimento Avançado</option>
        </select>
        <button class="btn-download" onclick="baixarAula(event)">Baixar Conteúdo 📥</button>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="face front" id="text-front">Buscando pergunta...</div>
            <div class="face back" id="text-back">Buscando resposta...</div>
        </div>
    </div>

    <div class="feedback-buttons">
        <button class="btn-danger" onclick="feedbackErro(event)">Errada</button>
        <button class="btn-success" onclick="feedbackAcerto(event)">Correta</button>
    </div>

    <div class="controls">
        <button class="btn-nav" id="btn-prev" onclick="prevCard(event)">Anterior</button>
        <span class="counter" id="card-counter">0 / 0</span>
        <button class="btn-nav" id="btn-next" onclick="nextCard(event)">Próximo</button>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">Alternar Tema 🌓</button>

    <script>
        let meusFlashcards = [];
        let indexAtual = 0;

        const cardElement = document.getElementById('card');
        const textFront = document.getElementById('text-front');
        const textBack = document.getElementById('text-back');
        const cardCounter = document.getElementById('card-counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const aulaSelect = document.getElementById('aula-select');

        async function carregarDadosAula(arquivoJson) {
            try {
                textFront.innerText = "Carregando dados...";
                textBack.innerText = "Carregando dados...";
                
                const resposta = await fetch(arquivoJson);
                meusFlashcards = await resposta.json();
                
                indexAtual = 0; 
                renderCard();
            } catch (erro) {
                console.error("Erro ao carregar o arquivo JSON:", erro);
                textFront.innerText = "Erro ao carregar os dados da aula.";
            }
        }

        function renderCard() {
            if (meusFlashcards.length === 0) return;
            
            cardElement.classList.remove('flipped'); 
            cardElement.classList.remove('shake');
            
            textFront.innerText = meusFlashcards[indexAtual].pergunta;
            textBack.innerText = meusFlashcards[indexAtual].resposta;
            
            cardCounter.innerText = `${indexAtual + 1} / ${meusFlashcards.length}`;

            btnPrev.disabled = indexAtual === 0;
            btnNext.disabled = indexAtual === meusFlashcards.length - 1;
        }

        function trocarAula() {
            carregarDadosAula(aulaSelect.value);
        }

        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function feedbackAcerto(event) {
            event.stopPropagation();
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function feedbackErro(event) {
            event.stopPropagation();
            const estaVirado = cardElement.classList.contains('flipped');
            
            cardElement.className = estaVirado ? 'flashcard flipped shake' : 'flashcard shake';
            
            setTimeout(() => {
                cardElement.className = estaVirado ? 'flashcard flipped' : 'flashcard';
            }, 500);
        }

        function nextCard(event) {
            event.stopPropagation(); 
            if (indexAtual < meusFlashcards.length - 1) {
                indexAtual++; 
                renderCard(); 
            }
        }

        function prevCard(event) {
            event.stopPropagation();
            if (indexAtual > 0) {
                indexAtual--; 
                renderCard(); 
            }
        }

        /* --- IMPLEMENTAÇÃO: RECURSO DE TEMA CLARO/ESCURO --- */
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        /* --- IMPLEMENTAÇÃO: DOWNLOAD DO CONTEÚDO ATUAL --- */
        function baixarAula(event) {
            event.stopPropagation();
            if (meusFlashcards.length === 0) return;

            // Converte o objeto atual da memória de volta para string estruturada do JSON
            const dataStr = JSON.stringify(meusFlashcards, null, 4);
            
            // Cria um arquivo binário virtual (Blob) contendo o texto estruturado do JSON
            const blob = new Blob([dataStr], { type: "application/json" });
            
            // Gera um link temporário para o download
            const url = URL.createObjectURL(blob);
            const linkTemporario = document.createElement('a');
            
            linkTemporario.href = url;
            linkTemporario.download = aulaSelect.value; // Nomeia o download com o nome atual (ex: aula1.json)
            
            // Força o clique invisível para iniciar o download e limpa a memória do navegador
            document.body.appendChild(linkTemporario);
            linkTemporario.click();
            document.body.removeChild(linkTemporario);
            URL.revokeObjectURL(url);
        }

        // Inicialização padrão puxando a primeira aula configurada
        carregarDadosAula(aulaSelect.value);
    </script>

</body>
</html>
